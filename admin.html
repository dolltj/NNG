<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Builder for custom weapons, attachments, and perks for the NNG character sheet.">
  <title>Config Admin — NNG Sheet</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>

  <div id="admin-screen">
    <header class="top-bar">
      <a class="top-bar-back" href="index.html">← Character Vault</a>
      <h1 class="top-bar-title">Config Admin</h1>
      <a class="btn btn-secondary" href="encounter.html" style="text-decoration:none">⚔ Encounter</a>
      <div class="top-bar-actions" id="auth-bar">
        <input class="field-input" id="auth-email" type="email" placeholder="GM email" style="width:180px">
        <input class="field-input" id="auth-password" type="password" placeholder="Password" style="width:140px">
        <button class="btn btn-secondary" id="sign-in-btn">Sign In</button>
        <button class="btn btn-primary" id="publish-btn" style="display:none">⬆ Publish to Everyone</button>
        <button class="btn btn-secondary" id="export-btn">↓ Export Custom Items</button>
      </div>
    </header>

    <main class="tab-content">
      <div class="section-header">Weapons</div>
      <div id="weapons-list"></div>
      <button class="btn btn-primary mt-md" id="new-weapon-btn">＋ New Weapon</button>
      <div id="weapon-form-container"></div>

      <div class="section-header mt-lg">Attachments</div>
      <div id="attachments-list"></div>
      <button class="btn btn-primary mt-md" id="new-attachment-btn">＋ New Attachment</button>
      <div id="attachment-form-container"></div>

      <div class="section-header mt-lg">Perks</div>
      <div id="perks-list"></div>
      <button class="btn btn-primary mt-md" id="new-perk-btn">＋ New Perk</button>
      <div id="perk-form-container"></div>

      <div class="section-header mt-lg">Enemies / Bad Guys</div>
      <p class="campaign-note">Define enemy stat blocks and action templates used by the <a href="encounter.html">Encounter Tracker</a>.</p>
      <div id="enemies-list"></div>
      <button class="btn btn-primary mt-md" id="new-enemy-btn">＋ New Enemy</button>
      <div id="enemy-form-container"></div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="util.js"></script>
  <script src="supabase-config.js"></script>
  <script src="remote-config.js"></script>
  <script src="weapon-store.js"></script>
  <script src="admin.js"></script>

</body>
</html>
