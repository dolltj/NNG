<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interactive NNG character sheet with multi-character roster, dice rolling, and Roll20 integration.">
  <title>Character Vault — NNG Sheet</title>
  <link rel="stylesheet" href="style.css">
  <!-- Preconnect for Google Fonts (loaded in CSS) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>

  <!-- ============================================
       ROSTER SCREEN
       ============================================ -->
  <div id="roster-screen" style="display:flex">
    <!-- Dynamically populated by app.js renderRoster() -->
    <div style="color:var(--text-muted);font-family:var(--font-body)">Loading…</div>
  </div>

  <!-- ============================================
       APP SCREEN (character sheet)
       ============================================ -->
  <div id="app-screen">

    <!-- Top Bar -->
    <header class="top-bar">
      <button class="top-bar-back" onclick="showRoster()">
        ← Characters
      </button>
      <h1 class="top-bar-title" id="top-bar-title">Character Name</h1>
      <div class="top-bar-actions">
        <div class="save-indicator" id="save-indicator">
          <div class="save-dot"></div>
          <span class="save-dot-label">Auto-save on</span>
        </div>
        <button class="btn btn-secondary" onclick="exportCharacter()" title="Export character to JSON file">
          ↓ Export
        </button>
        <button class="btn btn-secondary" onclick="importCharacter()" title="Import character from JSON file">
          ↑ Import
        </button>
      </div>
    </header>

    <!-- Tab Navigation -->
    <nav class="tab-nav" role="tablist" aria-label="Character sheet sections">
      <button class="tab-btn active" data-tab="tab-info"      role="tab">Character</button>
      <button class="tab-btn"        data-tab="tab-abilities"  role="tab">Abilities</button>
      <button class="tab-btn"        data-tab="tab-combat"     role="tab">Combat</button>
      <button class="tab-btn"        data-tab="tab-psycasts"   role="tab">Psycasts</button>
      <button class="tab-btn"        data-tab="tab-equipment"  role="tab">Equipment</button>
      <button class="tab-btn"        data-tab="tab-notes"      role="tab">Notes</button>
    </nav>

    <!-- Tab Content -->
    <main class="tab-content" id="tab-content">
      <div class="tab-panel active" id="tab-info"      role="tabpanel"></div>
      <div class="tab-panel"        id="tab-abilities"  role="tabpanel"></div>
      <div class="tab-panel"        id="tab-combat"     role="tabpanel"></div>
      <div class="tab-panel"        id="tab-psycasts"   role="tabpanel"></div>
      <div class="tab-panel"        id="tab-equipment"  role="tabpanel"></div>
      <div class="tab-panel"        id="tab-notes"      role="tabpanel"></div>
    </main>

  </div><!-- /#app-screen -->

  <!-- Toast container (injected by roll20-bridge.js) -->
  <div id="toast-container"></div>

  <!-- Scripts (order matters: dice → bridge → weapon-store → app) -->
  <script src="dice.js"></script>
  <script src="roll20-bridge.js"></script>
  <script src="weapon-store.js"></script>
  <script src="app.js"></script>

</body>
</html>
