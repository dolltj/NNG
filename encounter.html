<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GM encounter tracker for NNG — add enemies, track HP and armor, roll attacks to Roll20.">
  <title>Encounter Tracker — NNG Sheet</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>

  <div id="encounter-page">

    <header class="top-bar">
      <a class="top-bar-back" href="admin.html" style="text-decoration:none">← Admin</a>
      <h1 class="top-bar-title">⚔ Encounter Tracker</h1>
      <div class="top-bar-actions">
        <button class="btn btn-secondary" id="clear-btn">✕ Clear All</button>
        <button class="btn btn-primary" id="add-enemy-btn">＋ Add Enemy</button>
      </div>
    </header>

    <!-- Enemy cards row -->
    <div class="encounter-cards-row" id="encounter-cards">
      <p class="encounter-empty-msg" id="enc-empty">Loading enemy templates…</p>
    </div>

    <!-- Expanded detail panel (hidden until a card is selected) -->
    <div class="encounter-detail" id="encounter-detail" style="display:none"></div>

  </div>

  <div id="toast-container"></div>

  <!-- Scripts: util → supabase config → remote-config → dice → bridge → encounter -->
  <script src="util.js"></script>
  <script src="supabase-config.js"></script>
  <script src="remote-config.js"></script>
  <script src="dice.js"></script>
  <script src="roll20-bridge.js"></script>
  <script src="encounter.js"></script>

</body>
</html>
